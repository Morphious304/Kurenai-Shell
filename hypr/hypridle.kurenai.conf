# KURENAI lock screen + hypridle. This is a SAMPLE: merge the parts you want into ~/.config/hypr/hypridle.conf
# (`kurenai-ctl lock-hypridle` shows what your current file already does). Not applied automatically.

general {
    # what "lock" means: ask the always-running KURENAI locker (does nothing if already locked)
    lock_cmd = qs -c kurenai-lock ipc call lock lock
    # lock BEFORE the machine sleeps (lid close, Suspend, idle suspend): logind -> hypridle -> lock_cmd
    before_sleep_cmd = loginctl lock-session
}

# lock after 5 minutes without input
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Optional: suspend 10 minutes after that (the lock is already in place, and before_sleep_cmd re-checks).
# listener {
#     timeout = 900
#     on-timeout = systemctl suspend
# }
